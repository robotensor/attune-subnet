# Testnet: the netuid of the subnet you registered (btcli subnet create --network test), and its
# owner's wallet (or a validator's with a permit). Data is kept in var/testnet/.
network = "test"
netuid = 0
wallet = { name = "robotensor-owner", hotkey = "default" }

[vector]
policy_python = "/root/robotensor/.venvs/vector-policy/bin/python"
simulator_python = "/root/robotensor/.venvs/robotwin-bench/bin/python"
simulator_root = "/root/robotensor/vector/RoboTwin-Vector"
mirror = "robotensor/vector-results"
