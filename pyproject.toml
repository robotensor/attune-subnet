[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robotensor"
version = "0.2.0"
description = "The Robotensor Bittensor subnet: miner and validator for the Vector competition (Competition 1)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# bittensor 10.x: version 11 replaced the SDK's API (see chain.py). huggingface_hub reads and
# publishes submissions. A competition's engine and runtime come with its extra below; the
# benchmark fork it runs is a git install, because it is gigabytes of assets nothing imports.
dependencies = ["bittensor==10.5.0", "huggingface_hub>=1.0"]

[project.optional-dependencies]
# What a validator of each competition installs. The benchmark forks are not here: both engines
# run them as subprocesses and never import them, and they carry gigabytes of assets, so they are
# git installs (see docs/VALIDATOR.md).
vector = ["robotensor-vector-engine>=0.2", "robotensor-vector-runtime>=0.2"]
horizon = ["robotensor-horizon-engine>=0.2", "robotensor-horizon-runtime-zerowam>=0.2"]
dev = ["pytest>=8", "ruff==0.16.7"]

[project.scripts]
robotensor = "robotensor.cli:main"
# The names the two halves had before there was one command. They stay through 0.2, so a running
# validator's unit file and a miner's notes keep working.
robotensor-miner = "robotensor.miner:main"
robotensor-validator = "robotensor.validator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotensor"]
# The name the package had before it was something you install from an index, so a script that
# still imports it says so rather than failing.
force-include = { "src/robotensor_subnet.py" = "robotensor_subnet.py" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chain: needs a running subtensor (localnet)", "gpu: needs the simulator and a GPU"]
