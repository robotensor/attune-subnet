[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robotensor"
version = "0.2.0"
description = "Miner and validator tooling for the Robotensor Bittensor subnet."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["bittensor", "robotics", "robot-learning", "simulation"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# bittensor 11 changed the SDK API (see chain.py).
dependencies = ["bittensor==10.5.0", "huggingface_hub>=1.0"]

[project.optional-dependencies]
vector = ["robotensor-vector-runtime>=0.2"]
dev = ["pytest>=8", "ruff==0.16.7"]

[project.urls]
Repository = "https://github.com/robotensor/robotensor-subnet"

[project.scripts]
robotensor = "robotensor.cli:main"
# Pre-0.2 entry points, kept so existing unit files keep working.
robotensor-miner = "robotensor.miner:main"
robotensor-validator = "robotensor.validator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotensor"]
# Old import name, kept as a shim.
force-include = { "src/robotensor_subnet.py" = "robotensor_subnet.py" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chain: needs a running subtensor (localnet)", "gpu: needs the simulator and a GPU"]
