[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robotensor-subnet"
version = "0.1.0"
description = "The Robotensor Bittensor subnet: miner and validator for the Vector lane (Competition 1)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# bittensor 10.x: version 11 replaced the SDK's API (see chain.py). huggingface_hub reads and
# publishes submissions. The lane engine (icil-orchestrator), the benchmark plugin
# (robotwin-icil-competition) and the model runtime's check (vector-runtime) are on no package index:
# a validator installs them from their repositories (docs/VALIDATOR.md).
dependencies = ["bittensor==10.5.0", "huggingface_hub>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

[project.scripts]
robotensor-miner = "robotensor_subnet.miner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotensor_subnet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chain: needs a running subtensor (localnet)", "gpu: needs the simulator and a GPU"]
